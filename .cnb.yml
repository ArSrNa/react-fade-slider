$:
  vscode:
    - services:
        - vscode
        - docker
      docker:
        image: docker.cnb.cool/arsrna/dev-image/nodejs
        volumes:
          - /root/.bun/install/cache
          - /root/.npm
      imports:
        - https://cnb.cool/arsrna/env/-/blob/main/npm.yml
      runner:
        cpus: 16
      stages:
        - name: 安装依赖
          script: bun i

  push:
    sync:
      stages:
        - name: sync to github
          image: tencentcom/git-sync
          imports:
            - https://cnb.cool/arsrna/env/-/blob/main/git.yaml
          settings:
            target_url: https://github.com/ArSrNa/react-fade-slider
            auth_type: https
            username: ${GIT_USERNAME}
            password: ${GIT_ACCESS_TOKEN}
            git_email: "root@arsrna.cn"
    cr:
      docker:
        image: node:24
        volumes:
          - /root/.npm
          - /root/.bun/install/cache
      stages:
        - name: 安装
          script:
            - npm i -g bun
            - bun i
        - name: 测试覆盖率
          script: bun test
        - name: coverage
          type: testing:coverage
          options:
            diffLines: 69 # 增量覆盖率红线
          exports:
            lines: LINES
            diff_pct: DIFF_LINES
        - name: result
          script: echo echo "LINES $LINES DIFF_LINES $DIFF_LINES"

  # tag push 时触发 release 发版流程
  tag_push:
    - name: release
      docker:
        image: docker.cnb.cool/arsrna/dev-image/nodejs
      runner:
        cpus: 16
      stages:
        - name: 创建 release
          type: git:release
          options:
            tag: $CNB_BRANCH
          exports:
            version: RELEASE_VERSION
        - name: 同步版本并构建
          script:
            - npm version $RELEASE_VERSION --no-git-tag-version
            - bun i
            - bun run build
        - name: npm publish
          imports:
            - https://cnb.cool/arsrna/env/-/blob/main/npm.yml
          script:
            - npm publish
        - name: cnb-npm publish
          image: tencentcom/npm
          settings:
            username: $CNB_TOKEN_USER_NAME
            token: $CNB_TOKEN
            email: $CNB_COMMITTER_EMAIL
            registry: https://npm.cnb.cool/arsrna/os-npm/-/packages/
            folder: ./
            fail_on_version_conflict: false
